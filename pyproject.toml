[project]
name = "git2grit"
version = "0.0.2"
description = "Git on TUI steroids with OCD! Transform your Git history with AI-powered commit messages and streak protection."
readme = "README.md"
license = "MIT"
authors = [
    { name = "hammaadworks", email = "hammaadworks@gmail.com" }
]
urls = { Homepage = "https://grit.hammaadworks.com", Repository = "https://github.com/hammaadworks/grit", Issues = "https://github.com/hammaadworks/grit/issues" }
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "httpx>=0.28.1",
    "rich>=14.3.3",
    "typer>=0.24.1",
    "pydantic>=2.10.6",
    "pydantic-ai>=0.0.24",
    "loguru>=0.7.3",
]

[project.scripts]
grit = "grit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grit"]

[tool.hatch.build.targets.sdist]
include = [
    "src/grit",
    "README.md",
    "diagrams",
    "pyproject.toml",
    "LICENSE",
]
exclude = [
    "website/",
    "tests/",
    "docs/",
    "shots/",
    ".agents/",
    ".github/",
    ".idea/",
    ".pytest_cache/",
    ".venv/",
    ".coverage",
    "uv.lock",
    "skills-lock.json",
    ".gemini.md",
    ".python-version",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]
